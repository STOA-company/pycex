[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycex"
version = "0.4.0"
description = "Unified Python wrapper for cryptocurrency exchanges (Binance, Bybit, OKX, Bitget, Upbit, Bithumb, Korbit) — typed, async-first, with MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "STOA Company" },
]
keywords = [
    "crypto", "cryptocurrency", "exchange",
    "binance", "bybit", "okx", "bitget", "upbit", "bithumb", "korbit",
    "trading", "bitcoin", "ethereum",
    "api", "api-wrapper", "rest-api",
    "algorithmic-trading", "auto-trading",
    "quant", "quantitative-finance",
    "perpetual", "futures", "korean-won",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]
mcp = [
    "mcp[cli]>=1.0.0,<2",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.scripts]
pycex = "pycex.cli:main"
pycex-mcp = "pycex.mcp.server:run_server"

[project.urls]
Homepage = "https://github.com/Jaeminyx-Stoa/pycex"
Documentation = "https://jaeminyx-stoa.github.io/pycex/"
Repository = "https://github.com/Jaeminyx-Stoa/pycex"
Issues = "https://github.com/Jaeminyx-Stoa/pycex/issues"
Changelog = "https://github.com/Jaeminyx-Stoa/pycex/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pycex"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pycex.mcp.*"
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real exchange endpoints (network)"]
addopts = "-m 'not live'"

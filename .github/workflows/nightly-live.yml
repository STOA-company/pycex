name: Nightly Live Smoke

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Live Smoke (public endpoints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -m live tests/live -q
        env:
          ALLOW_NETWORK_TESTS: "1" # live tests are rejected in CI without this flag
